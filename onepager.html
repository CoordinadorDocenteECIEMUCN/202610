<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Individual — Emprendimientos Coquimbo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0efe8;color:#1a1a18;min-height:100vh}

/* NAV BAR */
.topbar{background:#1a3a5c;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.topbar-title{font-size:13px;opacity:.7;white-space:nowrap}
.topbar select{flex:1;min-width:220px;max-width:420px;padding:7px 10px;border:none;border-radius:7px;background:rgba(255,255,255,.15);color:#fff;font-size:13px;cursor:pointer}
.topbar select option{background:#1a3a5c;color:#fff}
.topbar button{padding:7px 14px;border:1px solid rgba(255,255,255,.3);border-radius:7px;background:transparent;color:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
.topbar button:hover{background:rgba(255,255,255,.15)}
.topbar .ctr{font-size:12px;opacity:.6;white-space:nowrap;margin-left:auto}

/* PAGE */
.page{max-width:960px;margin:0 auto;padding:24px}

/* HEADER CARD */
.header-card{background:#fff;border-radius:14px;border:1px solid #e0dfd8;overflow:hidden;margin-bottom:16px}
.header-top{background:#1a3a5c;padding:20px 24px}
.header-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:12px;font-weight:500;letter-spacing:.3px}
.b-sector{background:rgba(255,255,255,.18);color:#cde}
.b-idea{background:#7b5c00;color:#fff3cd}
.b-prototipo{background:#0c447c;color:#d6eaf8}
.b-piloto{background:#27500a;color:#d4edda}
.b-ventas{background:#3c3489;color:#e8d5f5}
.b-nd{background:#444;color:#ddd}
.h-num{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:6px}
.h-name{font-size:21px;font-weight:500;color:#fff;line-height:1.2;margin-bottom:8px}
.h-loc{font-size:12px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:5px}

.header-bottom{padding:16px 24px;display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #f0efe8}
.resumen-block{flex:3;min-width:240px}
.resumen-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888780;margin-bottom:5px}
.resumen-text{font-size:13px;line-height:1.6;color:#2c2c2a}
.contact-block{flex:1;min-width:180px}
.contact-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888780;margin-bottom:5px}
.contact-name{font-size:14px;font-weight:500}
.contact-info{font-size:12px;color:#5f5e5a;margin-top:2px}

/* METRICS — ahora solo 2 */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mc{background:#fff;border:1px solid #e8e7e0;border-radius:10px;padding:14px 16px}
.mc-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888780;margin-bottom:4px}
.mc-val{font-size:22px;font-weight:500;line-height:1;color:#1a1a18}
.mc-sub{font-size:11px;color:#888780;margin-top:3px}

/* STAGE TIMELINE VISUAL */
.stage-card{background:#fff;border:1px solid #e8e7e0;border-radius:12px;padding:20px 24px;margin-bottom:16px}
.stage-card-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888780;margin-bottom:16px}
.stage-track{display:flex;align-items:stretch;gap:0;position:relative}
.stage-connector{position:absolute;top:24px;left:24px;right:24px;height:3px;background:#e0dfd8;z-index:0}
.stage-connector-fill{position:absolute;top:0;left:0;height:100%;border-radius:2px;transition:width .5s ease}
.stage-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.stage-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #e0dfd8;background:#f8f7f2;transition:all .3s;flex-shrink:0}
.stage-circle.active{border-width:3px;box-shadow:0 0 0 5px rgba(0,0,0,.06)}
.stage-circle.done{border-width:3px}
.stage-name{font-size:11px;font-weight:500;color:#888780;text-align:center;line-height:1.3}
.stage-name.active{font-weight:600}
.stage-pill{font-size:9px;padding:2px 6px;border-radius:8px;margin-top:2px;text-align:center}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.card{background:#fff;border:1px solid #e8e7e0;border-radius:12px;padding:16px}
.card.full{grid-column:1/-1}
.card-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888780;margin-bottom:8px}
.card-text{font-size:13px;line-height:1.6;color:#2c2c2a}
.card-text.empty{color:#aaa9a2;font-style:italic}

/* TAGS */
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#f0efe8;color:#5f5e5a;border:1px solid #e0dfd8}
.empty-tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#fafaf8;color:#aaa9a2;border:1px dashed #d3d1c7;font-style:italic}

/* VALIDATION LIST */
.val-list{display:flex;flex-direction:column;gap:6px}
.val-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#2c2c2a;line-height:1.4}
.val-dot{width:8px;height:8px;border-radius:50%;background:#639922;flex-shrink:0;margin-top:3px}
.val-dot.empty{background:#d3d1c7}

/* COMPLETITUD */
.prog-bar{background:#e8e7e0;border-radius:4px;height:6px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:#185FA5}

@media print{
  .topbar{display:none!important}
  .page{padding:10px;max-width:100%}
  body{background:#fff}
  .card{break-inside:avoid}
}
</style>
</head>

<script>
const DATA = [{"n":1,"nombre":"Amatista Travels — Stargazing Experience","resumen":"Tour astronómico nocturno que resuelve la contaminación acústica y lumínica mediante headsets con cancelación de ruido activo y transmisores inalámbricos entre guía y turistas. Proyecta hologramas de cuerpos celestes y constelaciones con láser. Se dirige a turistas que buscan experiencias astronómicas premium en el Valle de Elqui.","provincia":"Elqui","comuna":"Vicuña","sector":"Turismo sostenible","etapa":"Idea","problema":"La contaminación lumínica. Los turistas son los directos beneficiados. El objetivo es que los ruidos molestos no sean impedimento para realizar un tour astronómico nocturno.","solucion":"Es con la creación de un headset que tenga cancelación de ruido activo y pasivo. Además, que integren transmisores inalámbricos con micrófono unidireccional..La propuesta es ofrecer una solución tecnológica que permita la realización normal del tour astronómico ante condiciones acústicas adversas. Hasta se puede patentar.","segmento":"","beneficios":"Calidad de servicio en cualquier situación y garantizar la correcta realización del tour astronómico.","modelo_ingresos":"Contamos con una estructura definida de ingresos y costos principales, con estimaciones y supuestos que estamos usando para tomar decisiones.","financiamiento":"Ventas, Fondos públicos, Inversión privada","alianzas":"Con instituciones (U/incubadora), Con municipio/gobierno local","tecnologia":"Telescopios, cámara digital y cámara/telescopio inteligente. Audífono tipo headset con micrófono y transmisor inalámbrico.","email":"info@amatistatravels.net","contacto":"Iván Olivares","telefono":"961914612","req3":"Alianzas comerciales, Difusión, Financiamiento","validacion":"Entrevistas con usuarios"},
{"n":2,"nombre":"Analítica Soluciones","resumen":"Proyecto educativo que facilita el acceso a tecnologías de la información a estudiantes rurales desde los fundamentos, con enfoque en aprender haciendo. Los estudiantes instalan programas, crean sus propios scripts y construyen circuitos desde cero. Se diferencia por no usar estructuras preformateadas, priorizando la personalización del aprendizaje.","provincia":"Limarí","comuna":"Ovalle","sector":"Sectores emergentes","etapa":"Prototipo","problema":"Acceso a las TI, estudiantes rurales.","solucion":"Desde la personalización y el aprender haciendo..Facilito el acceso a las tecnologías de información a los jóvenes estudiantes rurales desde los principios, no aplico o uso estructuras preformateadas, las niñas y niños aprenden instalando los programas, eligiendo los IDES y creando sus propios scripts, para luego simular y construir sus propios circuitos o robots, aplicando esta tecnología para elaborar soluciones que tienen que ver con su propia realidad.","segmento":"","beneficios":"Comprensión de los ecosistemas digitales al alto nivel.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Aplicación del proyecto en liceos y escuelas rurales.","alianzas":"Ninguna","tecnologia":"Herramientas de IA (texto/imagen/audio/video), Hardware/sensores/IoT, Bases de datos/analítica, scripting, simuladores de robótica, machine learning.","email":"analitica_soluciones@zohomail.com","contacto":"Jorge Rolando Ortiz Morales","telefono":"","req3":"Mentoría técnica, Mentoría negocio, Financiamiento","validacion":"Pruebas de usabilidad / playtest"},
{"n":3,"nombre":"Artemila & Co. — Gestión Escénica","resumen":"Modelo tecnológico-metodológico que sistematiza la gestión estratégica de proyectos escénicos independientes. Transforma procesos informales de administración artística en sistemas estructurados con modelos de ingresos, protocolos de circulación y herramientas replicables. Se dirige a artistas y compañías con obra profesionalizada pero sin capacidades de gestión.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Idea","problema":"El sector creativo independiente presenta una brecha estructural entre desarrollo artístico y sostenibilidad económica. Artistas y compañías escénicas con obras profesionalizadas carecen de herramientas estratégicas, metodologías de gestión y sistemas estructurados que les permitan diseñar modelos de ingresos sostenibles, planificar circulación, proyectar crecimiento y reducir dependencia exclusiva de fondos públicos. El problema no es falta de talento, sino ausencia de estructura y sistematización.","solucion":"El proyecto implementa un modelo estructurado de intervención que: Sistematiza el diagnóstico estratégico del proyecto artístico. Diseña un modelo de ingresos específico para su naturaleza escénica. Estandariza procesos de gestión y circulación. Genera protocolos replicables que puedan evolucionar hacia una futura plataforma digital. Esta fase permite validar y ajustar la metodología en terreno, generando la base para su posterior desarrollo tecnológico. No es consultoría aislada: es validación de modelo.","segmento":"","beneficios":"Incremento de capacidad de generación de ingresos propios. Claridad estratégica y planificación de expansión. Formalización y profesionalización de gestión. Reducción de dependencia estructural de financiamiento público. Instalación de un modelo de crecimiento sostenible.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Ninguna","alianzas":"Ninguna","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Bases de datos/analítica.","email":"camilacereda@gmail.com","contacto":"Camila Lourdes Cereda","telefono":"56 9 5486 0113","req3":"Mentoría técnica, Mentoría negocio, Acceso prototipado/testeo","validacion":"Ninguna aún"},
{"n":4,"nombre":"Auto examen en digital","resumen":"Proyecto de educación y prevención del cáncer testicular en hombres jóvenes mediante videos creativos generados con IA. Busca visibilizar un tema poco hablado para aumentar la consulta médica temprana en los 130.000 hombres de la región. Es el primer proyecto de este tipo en Chile con enfoque en innovación comunicacional.","provincia":"Elqui","comuna":"Coquimbo–La Serena","sector":"Sectores emergentes","etapa":"Idea","problema":"educación y visibilización instruida, y beneficia a 130,000 hombres de la región.","solucion":"Al hacer visible un tema tan sensible y poco visible, buscaremos aumentar por medio de la pesquisa la incidencia real en la comunidad, resolviendo uno de los principales problemas de salud de los hombres que es la NO consulta médica, y al haber pesquisa primaria llegas antes siendo así menores los impactos y gastos para el país. No existe nada como lo que pretendemos hacer en el país, y generar con IA una serie de videos creativos para educar, incidir y visibilizar este cáncer en hombres marcaría una diferencia en lo social.","segmento":"","beneficios":"Como beneficio directo, entregamos las órdenes para ecografías testiculares en forma completamente gratuita, del mismo modo analizamos y revisamos los exámenes con personal médico en forma gratuita. Realizamos charlas gratuitas en CFT, colegios, universidades.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Fondos públicos, Inversión privada, Crowdfunding","alianzas":"Con municipio/gobierno local","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video). Creando videos cortos, lúdicos, cercanos, fáciles de entender.","email":"fundacioncancertesticular@gmail.com","contacto":"Héctor Guzmán","telefono":"56985028520","req3":"Mentoría negocio, Financiamiento, Propiedad Intelectual (PI)","validacion":"Entrevistas con usuarios"},
{"n":5,"nombre":"Biotecnopiel","resumen":"Plataforma digital que ofrece formulaciones cosméticas completamente personalizadas mediante una app con IA y escáner digital de la piel. Integra biotecnología aplicada con plantas medicinales y energías renovables en un modelo 100% online. Resuelve la estandarización del mercado cosmético que genera baja efectividad y reacciones adversas.","provincia":"Elqui","comuna":"La Serena","sector":"Industria y servicios conexos, Sectores emergentes","etapa":"Idea","problema":"Biotecnopiel resuelve la falta de personalización real en el cuidado de la piel del rostro y del cuerpo, ya que actualmente la mayoría de los productos cosméticos son estandarizados y no consideran las características individuales de cada persona, lo que genera reacciones adversas, baja efectividad y gasto innecesario por ensayo y error.","solucion":"Biotecnopiel resuelve esta brecha mediante un modelo digital que integra biotecnología aplicada y tecnología, ofreciendo recomendaciones personalizadas de cuidado de la piel a través de una plataforma 100% online. Opera en tres niveles: Diagnóstico digital inicial (APP), Recomendación personalizada basada en biotecnología, y Modelo de venta directa online y escalable de los productos personalizados.","segmento":"","beneficios":"Biotecnopiel entrega como beneficio concreto una solución personalizada e integral para el cuidado de la piel mediante una aplicación con inteligencia artificial que incorpora escáner digital y otros métodos de recopilación de información para generar un perfil preciso y diseñar un producto natural único para cada usuario.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Fondos públicos","alianzas":"Con instituciones (U/incubadora)","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Hardware/sensores/IoT, Bases de datos/analítica.","email":"fernanda.lazo.velasquez@gmail.com","contacto":"Fernanda Lazo","telefono":"51505050","req3":"Mentoría técnica, Mentoría negocio, Acceso prototipado/testeo","validacion":"Entrevistas con usuarios, Test de concepto, Evaluación académica / revisión técnica preliminar"},
{"n":6,"nombre":"Bola de Nieve — Infraestructura Musical","resumen":"Primera infraestructura tecnológica integrada para la economía musical de la Región de Coquimbo, que transforma eventos y talento artístico en datos estratégicos y activos económicos. Aborda la fragmentación y baja digitalización del sector cultural regional. Su propuesta conecta artistas, sellos, productoras y gestores en un ecosistema escalable.","provincia":"Elqui","comuna":"La Serena","sector":"Industria y servicios conexos, Turismo sostenible, Sectores emergentes","etapa":"Prototipo","problema":"La Región de Coquimbo carece de infraestructura tecnológica que permita transformar su actividad cultural en una industria sofisticada. El problema estructural no es la falta de talento, sino la baja digitalización, la fragmentación de servicios y la ausencia de sistemas de análisis que conviertan los eventos culturales en información estratégica y activos económicos.","solucion":"Resolvemos la fragmentación mediante la construcción de una infraestructura empresarial y tecnológica integrada, diseñada para transformar la escena local en una industria creativa escalable. El proyecto integra: ticketera inteligente, booking basado en data, editora musical, sello discográfico y plataforma tecnológica regional.","segmento":"","beneficios":"Convertimos actividad cultural en activos económicos medibles y escalables. El proyecto transforma talento regional en ingresos sostenibles y trazables, propiedad intelectual formalizada y data estratégica para negociación.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Fondos públicos","alianzas":"Con pares/otros proyectos","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Realidad Extendida, Bases de datos/analítica.","email":"salamancatrompeta251@gmail.com","contacto":"Christopher Salamanca","telefono":"97328322","req3":"Mentoría negocio, Difusión, Financiamiento","validacion":"Ninguna aún"},
{"n":7,"nombre":"Centro Illawara","resumen":"Consultora de bienestar empresarial que ofrece sesiones de yoga, meditación, relajación y mindfulness para empresas, colegios e instituciones de la Provincia del Choapa. Busca crear un ecosistema sano y equilibrado integrando tecnología para ampliar el alcance de sus servicios.","provincia":"Choapa","comuna":"Illapel","sector":"Turismo sostenible","etapa":"Ventas iniciales","problema":"Busco crear una consultora de bienestar empresarial que busca crear un ecosistema sano y equilibrado en el Choapa. Llegando a empresas, colegios, instituciones.","solucion":"Mediante la práctica de técnicas de relajación o mindfulness por ejemplo Yoga, Relajación, meditación. Es la propuesta de un bienestar integral mediante sesiones o prácticas que promuevan el descanso y desarrollo humano mediante nuestros servicios de forma consciente.","segmento":"","beneficios":"Los clientes recuperen su vitalidad, descanso y estén más conscientes en su mente, pudiendo mejorar su productividad y calidad de vida.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Inversión privada","alianzas":"Con municipio/gobierno local","tecnologia":"Herramientas de IA (texto/imagen/audio/video). App y realidad aumentada para hacer el proceso más práctico.","email":"centroillawara@hotmail.com","contacto":"Francisco Coronado","telefono":"56994540827","req3":"Contactos industria, Alianzas comerciales, Difusión","validacion":"Entrevistas con usuarios, Ventas / preventas"},
{"n":8,"nombre":"Cervecería Choapa","resumen":"Cervecería artesanal vegana con identidad territorial que incorpora economía circular mediante reciclaje de residuos propios y uso de insumos locales. Combina propósito ambiental con una experiencia de marca exclusiva ligada al Choapa.","provincia":"Choapa","comuna":"Canela","sector":"Alimentos","etapa":"Piloto","problema":"La escasa oferta de productos con identidad local. Los beneficiarios serían consumidores conscientes locales entre 18-50 años que busquen productos con propósito y exclusivos, comercio (botillerías, restaurant, entre otros) y turistas.","solucion":"Resuelvo esta necesidad desarrollando una oferta diversificada de cervezas artesanales que integran identidad territorial, mediante el uso de insumos locales y alianzas con productores de la zona, generando un producto exclusivo con valor agregado y fortaleciendo la economía local. Cervecería Choapa se diferencia por el reciclaje de sus residuos, etiquetas y contenido visual basado en la biodiversidad del territorio, uso de IA para control de procesos y recetas y futura energía limpia (eólica/solar).","segmento":"","beneficios":"Una experiencia de consumo auténtica, sustentable y vinculada al territorio que eleva la oferta disponible en la provincia del Choapa.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas","alianzas":"Ninguna","tecnologia":"Herramientas de IA (texto/imagen/audio/video). Equipamiento y control técnico de procesos para asegurar calidad y recetas innovadoras.","email":"nicolas.gonzalezg@mayor.cl","contacto":"Nicolas Gonzalez","telefono":"56965954477","req3":"Mentoría negocio, Acceso prototipado/testeo, Difusión","validacion":"Entrevistas con usuarios, Ventas / preventas, Cata de análisis sensorial"},
{"n":9,"nombre":"Chawuareche — Experiencia Inmersiva IA","resumen":"Experiencia inmersiva con IA creativa que reinterpreta símbolos, relatos y cosmovisiones Molle y Diaguita integrándolos en narrativas contemporáneas sobre astronomía, paisaje y memoria territorial de Combarbalá. Busca fortalecer la identidad territorial, la educación intercultural y el turismo cultural.","provincia":"Limarí","comuna":"Combarbalá","sector":"Turismo sostenible, Sectores emergentes","etapa":"Idea","problema":"Desconexión entre la comunidad y su patrimonio natural-cultural junto con la necesidad de un desarrollo sostenible, promoviendo una relación más respetuosa y consciente con el entorno. Los beneficiarios serán comunidades locales, estudiantes y agentes culturales de la comuna de Combarbalá.","solucion":"Lo resolveremos a través de experiencias inmersivas con inteligencia artificial creativa. Chawuareche reinterpreta símbolos, geometrías, relatos y cosmovisiones Molle y Diaguita, integrándolos en narrativas contemporáneas que dialoguen con la ciencia astronómica, el paisaje cordillerano y la memoria arqueológica de la provincia del Limarí. La propuesta de valor es fortalecer la identidad territorial de Combarbalá, la educación intercultural y el turismo cultural.","segmento":"","beneficios":"El desarrollo del turismo cultural experiencial de alto valor agregado. La experiencia inmersiva posicionará a la comuna de Combarbalá como un destino cultural de observación astronómica único en Chile.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Inversión privada","alianzas":"Con instituciones (U/incubadora), Con pares/otros proyectos","tecnologia":"Motor de videojuegos (Unity/Unreal/Godot), Herramientas de IA (texto/imagen/audio/video), Realidad Extendida AR/VR, Hardware/sensores/IoT, Bases de datos/analítica.","email":"ufisa.pedicab@gmail.com","contacto":"Francisco Angel","telefono":"56976527757","req3":"Alianzas comerciales, Difusión, Financiamiento","validacion":"Entrevistas con usuarios"},
{"n":10,"nombre":"Cultix — Sistema de Gestión Cultural","resumen":"Sistema operativo integral para la producción de eventos culturales que centraliza logística, itinerarios, alertas de riesgo y documentación en una sola plataforma. Reemplaza el uso fragmentado de Excel, WhatsApp y correos, reduciendo errores humanos y desgaste de los equipos.","provincia":"Limarí","comuna":"Ovalle","sector":"Sectores emergentes","etapa":"Prototipo","problema":"CULTIX resuelve la fragilidad operativa en la producción cultural. Actualmente, la gestión de eventos y festivales se realiza con herramientas fragmentadas como Excel, WhatsApp y correos electrónicos, lo que genera duplicidad de tareas, errores humanos, pérdida de información y alta ansiedad operativa. Esto pone en riesgo la reputación institucional, especialmente en eventos con artistas, invitados y logística compleja.","solucion":"CULTIX centraliza toda la información crítica del evento en un núcleo operativo único que: Cruza agendas automáticamente. Detecta conflictos antes de que ocurran. Vincula logística (vuelos, hoteles, transporte) con cronogramas. Genera alertas en tiempo real. Consolida documentación en un repositorio seguro. Entrega dashboards de visibilidad para dirección. Su implementación es ágil (menos de 48 horas en proyectos urgentes), permitiendo que el equipo pase de una gestión reactiva a una gestión anticipatoria y basada en datos.","segmento":"","beneficios":"CULTIX entrega: Hasta 40% de reducción de carga administrativa. Disminución drástica de errores logísticos. Visibilidad operativa 24/7 para dirección. Trazabilidad total de información. Conservación de memoria institucional.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos","alianzas":"Con municipio/gobierno local","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Bases de datos/analítica.","email":"gaorley@gmail.com","contacto":"Gabriel Alfonso Oro Leyton","telefono":"56987945164","req3":"Mentoría técnica, Mentoría negocio, Contactos industria","validacion":"Entrevistas con usuarios, Test de concepto, Validación por experiencia directa en producción cultural"},
{"n":11,"nombre":"Cyanodata","resumen":"Plataforma web que convierte la luz solar en una variable medible y cartografiable aplicada a procesos fotoquímicos creativos como la cianotipia. Integra módulo de georreferenciación de datos ambientales y módulo colaborativo de intercambio de registros entre artistas.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Idea","problema":"Los procesos fotoquímicos que utilizan la luz solar, como la cianotipia, dependen directamente de variables ambientales como radiación, altitud solar, azimut y humedad. Actualmente no existe una herramienta que sistematice estos datos y los vincule con resultados reales obtenidos en distintos territorios. Esto obliga a trabajar principalmente mediante ensayo y error.","solucion":"El problema se resuelve mediante una página web madre (CyanoData) que integra dos módulos: CyanoMetrics: sistema de georreferenciación que muestra radiación, altitud solar, azimut y humedad, y que analiza registros de bracketings para ofrecer referencias sobre tiempos de exposición y posicionamiento. CyanoAtlas: cartografía solar colaborativa donde cada usuario puede subir una obra por ubicación, incorporando ficha técnica detallada, generando un mapa global de resultados fotoquímicos.","segmento":"","beneficios":"CyanoData permite tomar decisiones más precisas en procesos fotoquímicos que dependen de la luz solar, reduciendo el ensayo y error y aumentando la consistencia de los resultados.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos","alianzas":"Con pares/otros proyectos","tecnologia":"Desarrollo web/app (stack libre), Bases de datos/analítica.","email":"laboratorioelementa@gmail.com","contacto":"María Piedad Aguirre","telefono":"48132967","req3":"Acceso prototipado/testeo, Financiamiento, Propiedad Intelectual (PI)","validacion":"Entrevistas con usuarios, Test de concepto"},
{"n":12,"nombre":"Depresión Intermedia Sonora","resumen":"Proyecto musical que valoriza los biomas, flora y fauna de la Región de Coquimbo a través de composiciones sonoras con identidad territorial. Aporta a la descentralización cultural generando experiencias fuera de la zona metropolitana.","provincia":"Elqui","comuna":"Coquimbo","sector":"Turismo sostenible","etapa":"Idea","problema":"Resuelve la necesidad de tener una experiencia cultural fuera de la zona metropolitana, aportando a la descentralización además de valorar nuestro territorio (Coquimbo). Los beneficiarios son los ciudadanos de la comuna de Coquimbo, además de turistas.","solucion":"Realizando un trabajo profundo en reconstruir la identidad, también presentarlo en un lugar transitado. El valor del proyecto radica en la valorización de la región de Coquimbo, trabajando en torno a sus biomas, flora, fauna, mediante la música.","segmento":"","beneficios":"Preservación de la identidad local, considerando el entorno y cómo debemos cuidarlo.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Ventas, Fondos públicos, Inversión privada, Patrocinio","alianzas":"Ninguna","tecnologia":"Herramientas de IA (texto/imagen/audio/video), Realidad Extendida aumentada/virtual, Mapping/instalación interactiva, Hardware/sensores/IoT, Bases de datos/analítica.","email":"sebastianolivares.cor@gmail.com","contacto":"Sebastián Eduardo Olivares Cortés","telefono":"569 36721837","req3":"Mentoría técnica, Alianzas comerciales, Financiamiento","validacion":"Ninguna aún"},
{"n":13,"nombre":"Descarbonizando jugando...","resumen":"Juego educativo interactivo sobre descarbonización y energías renovables dirigido a públicos desde párvulos hasta adultos. Integra narrativa y mecánicas lúdicas para generar conciencia sobre tecnologías limpias.","provincia":"","comuna":"","sector":"Alimentos, Industria y servicios conexos, Turismo sostenible, Sectores emergentes","etapa":"Idea","problema":"La educación sobre la descarbonización, desde los niños hasta los adultos. Necesidad de comprender el uso de tecnología y aplicaciones de energías renovables.","solucion":"Educando y jugando. A través del juego resolvemos interrogantes sobre el uso de tecnología y aplicaciones de energías renovables: ¿cómo funciona?, ¿para qué se usan? y ¿por qué debemos usarlas? La propuesta contempla una solución integral con impacto desde las bases (educación parvularia) hacia adelante.","segmento":"","beneficios":"Conciencia ambiental sobre el uso de energías renovables y reducción de huella de carbono.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Inversión privada, Patrocinio","alianzas":"Ninguna","tecnologia":"Motor de videojuegos (Unity/Unreal/Godot), Herramientas de IA (texto/imagen/audio/video), Mapping/instalación interactiva.","email":"hhesolar@gmail.com","contacto":"","telefono":"","req3":"Alianzas comerciales, Difusión, Financiamiento","validacion":"Carta de interés / LoI"},
{"n":14,"nombre":"Ecofem construcciones sustentables","resumen":"Empresa constructora que transforma residuos de construcción, plásticos y vidrios en soluciones constructivas innovadoras y sustentables en la Provincia del Choapa. Opera con un modelo de economía circular que recupera, restaura y reutiliza materiales.","provincia":"Choapa","comuna":"Los Vilos","sector":"Industria y servicios conexos","etapa":"Piloto","problema":"El principal problema que aborda Ecofem Construcciones SPA es la alta generación de residuos provenientes de obras de construcción, mueblería y sistemas eléctricos, materiales que generalmente terminan en vertederos o microbasurales. La empresa ofrece la recuperación, restauración y reutilización de estos materiales, otorgándoles una segunda oportunidad y prolongando su vida útil.","solucion":"En Ecofem Construcciones SPA resolvemos este problema mediante un modelo integral basado en la recuperación, restauración y transformación de residuos de construcción, mueblería y sistemas eléctricos. Implementamos un sistema de recolección y clasificación de materiales que aún pueden ser reutilizados o reacondicionados. A través de nuestro programa de reciclaje, transformamos plásticos y vidrios en nuevos productos para el área de la construcción.","segmento":"","beneficios":"El beneficio concreto que entregamos es la reducción real de residuos de construcción en la Provincia del Choapa, transformándose en productos funcionales y comercializables como muebles elaborados con material recuperado y soluciones constructivas sustentables.","modelo_ingresos":"Contamos con una estructura definida de ingresos y costos principales, con estimaciones y supuestos que estamos usando para tomar decisiones.","financiamiento":"Ventas, Fondos públicos, Inversión privada, Patrocinio","alianzas":"Con instituciones (U/incubadora), Con industria/empresas, Con municipio/gobierno local","tecnologia":"Motor de videojuegos, Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Realidad Extendida aumentada/virtual.","email":"estrella.tg136@gmail.com","contacto":"Estrellita Tapia Galvez","telefono":"56949310009","req3":"Alianzas comerciales, Difusión, Financiamiento","validacion":"Entrevistas con usuarios, Test de concepto, Pruebas de usabilidad / playtest, Piloto con cliente/aliado, Ventas / preventas, Carta de interés / LoI"},
{"n":15,"nombre":"EDUCATEA","resumen":"Empresa que desarrolla materiales educativos para la neurodiversidad co-diseñados con profesores y familias, con identidad gráfica y sonora local. Resuelve la ausencia de productos educativos adaptados al contexto chileno.","provincia":"Elqui","comuna":"Vicuña","sector":"Industria y servicios conexos, Sectores emergentes","etapa":"Prototipo","problema":"Productos educativos para la neurodiversidad desde una mirada mercado local.","solucion":"Desarrollando productos educativos con una mirada local y según las necesidades de los usuarios. El material se diseña en conjunto con profesores y apoderados que trabajan con el mundo neurodiverso y se diseña a la medida y en un idioma local tanto gráficamente como sonoramente. Hoy en día se compra todo afuera del país. Se hizo un análisis de la competencia en Chile y en la región no encontramos competidores importantes.","segmento":"","beneficios":"Productos hechos a la medida para colegios, profesores y familias que trabajan con estudiantes neurodiversos.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Inversión privada, Patrocinio","alianzas":"Con industria/empresas","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Realidad Extendida aumentada/virtual, Hardware/sensores/IoT, Bases de datos/analítica.","email":"marcelo.gomez@gmail.com","contacto":"Juan Marcelo Gómez Cáceres","telefono":"56962298324","req3":"Mentoría técnica, Mentoría negocio, Financiamiento","validacion":"Entrevistas con usuarios, Pruebas de usabilidad / playtest, Piloto con cliente/aliado"},
{"n":16,"nombre":"Estudio Serena - Audio inmersivo Dolby Atmos","resumen":"Servicio de producción de audio inmersivo Dolby Atmos para artistas, sellos y productoras que buscan diferenciarse con estándares internacionales de calidad de sonido. Único estudio fuera de la Región Metropolitana en el directorio Dolby Atmos Music Studio de Chile.","provincia":"","comuna":"","sector":"Sectores emergentes","etapa":"Ventas iniciales","problema":"En la Región de Coquimbo existe alta demanda potencial por contenidos con estándares internacionales (Dolby Atmos / audio inmersivo), pero muy poca oferta accesible. Para la mayoría de artistas, sellos y productoras, migrar a inmersivo es difícil por tres razones: infraestructura y costos, falta de know-how, y riesgo de rechazo o mal desempeño en plataformas.","solucion":"Servicio estandarizado que toma un contenido (canción, catálogo, pieza audiovisual o branded content) y lo transforma en una entrega inmersiva preparada para distribución y reproducción real. La solución combina: diagnóstico técnico-creativo, preparación inteligente del material, mezcla inmersiva, control de calidad y acompañamiento al cliente. En simple: convierte una barrera técnica compleja en un resultado claro, medible y entregable.","segmento":"","beneficios":"Diferenciación inmediata del contenido en el mercado. Menos fricción para publicar en plataformas. Sonido premium frente a la competencia en estéreo. Entregables con QC que reducen el riesgo de rechazo o retrabajo.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Inversión privada","alianzas":"Con instituciones (U/incubadora)","tecnologia":"Herramientas de IA (texto/imagen/audio/video), Dolby Atmos.","email":"infoestudioserena@gmail.com","contacto":"","telefono":"","req3":"Contactos industria, Alianzas comerciales, Internacionalización","validacion":"Entrevistas con usuarios, Test de concepto, Pruebas de usabilidad, Piloto con cliente/aliado, Ventas / preventas"},
{"n":17,"nombre":"Incubadora Creabeats","resumen":"Incubadora musical que integra laboratorio de producción, academia y lanzador para conectar talento emergente con tecnología de punta y la industria musical. Ofrece acceso a herramientas de vanguardia como IA y síntesis modular, junto con mentoría profesional y redes de la industria.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Prototipo","problema":"El problema central es la desconexión entre el talento musical emergente, la tecnología de punta y las oportunidades reales de la industria, agravada por la falta de acceso a redes profesionales y modelos de negocio sostenibles en contextos locales. Jóvenes con ideas musicales innovadoras no cuentan con formación actualizada, equipamiento profesional, ni conexiones con el ecosistema.","solucion":"La incubadora opera como un puente activo que conecta talento, tecnología e industria. El ciclo completo incluye: Laboratorio + Academia + Lanzador. Para el alumno: acceso a herramientas de vanguardia (IA, VST, sintetizadores). Modelo de negocio híbrido donde el artista invierte en formación y al lanzar su música, el sello y el artista comparten las regalías futuras.","segmento":"","beneficios":"Un lanzamiento profesional publicado en todas las plataformas digitales (Spotify, Apple Music, Tidal, etc.) bajo el sello de la incubadora. Mentoría de alto nivel y acceso a redes de la industria musical nacional e internacional.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Fondos públicos","alianzas":"Con pares/otros proyectos","tecnologia":"Hardware/sensores/IoT. IA, síntesis modular, colaboración remota.","email":"weinkeys88@gmail.com","contacto":"Esteban Mondaca Bravo","telefono":"36779212","req3":"Contactos industria, Difusión, Financiamiento","validacion":"Pruebas de usabilidad / playtest, Piloto con cliente/aliado"},
{"n":18,"nombre":"Innvoice Movement","resumen":"Instalaciones sonoras inmersivas con tecnología cuadrafónica que transforman relatos íntimos de mujeres en experiencias sensoriales envolventes, seguidas de conversatorios facilitados. Aborda la brecha de representación de la voz femenina en espacios públicos y laborales.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Idea","problema":"En entornos públicos, educativos y laborales persiste una brecha estructural de representación y legitimación de la voz femenina, particularmente en relatos vinculados a experiencias de exclusión, violencia simbólica o autocensura por miedo, vergüenza o falta de oportunidad. Se manifiesta en baja circulación de narrativas en primera persona y normalización del auto-silenciamiento.","solucion":"El proyecto aborda el problema mediante un proceso estructurado en cuatro fases: Fase 1: Convocatoria y recopilación de relatos con protocolo ético de grabación. Fase 2: Producción sonora cuadrafónica. Fase 3: Instalación inmersiva en espacio público o educativo. Fase 4: Conversatorio guiado con facilitación especializada y sistematización de aprendizajes.","segmento":"","beneficios":"A nivel individual: validación, resignificación y reparación simbólica para mujeres participantes. Desarrollo de empatía y conciencia crítica en la audiencia. A nivel comunitario: generación de diálogo intergeneracional y fortalecimiento de la participación.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Inversión privada, Patrocinio","alianzas":"Con pares/otros proyectos","tecnologia":"Cuadrafonía para transformar relatos íntimos en experiencia sonora inmersiva y espacializada.","email":"zetapaula@gmail.com","contacto":"Paula Zabala","telefono":"48856512","req3":"Mentoría negocio, Contactos industria, Acceso prototipado/testeo","validacion":"Entrevistas con usuarios"},
{"n":19,"nombre":"kimbo","resumen":"Proyecto de contenido infantil que usa el personaje Capitán Kimbo para fortalecer el sentido de pertenencia, la identidad local y la convivencia sana en niños y jóvenes. Responde a la pérdida de referentes culturales positivos en comunidades locales.","provincia":"Elqui","comuna":"Coquimbo","sector":"Industria y servicios conexos, Turismo sostenible, Sectores emergentes","etapa":"Prototipo","problema":"Pérdida del sentido de pertenencia en espacios comunitarios y con el patrimonio cultural. Niños y jóvenes son los beneficiarios.","solucion":"El Capitán Kimbo no solo entrega historias; entrega un sentido de hogar. Su propuesta es transformar nuestra ciudad en un gran equipo, donde la amistad es el motor, el compañerismo es la regla y el sentido de pertenencia es la capa que todos los niños pueden usar para proteger su comunidad.","segmento":"","beneficios":"Crear una comunidad donde los niños se sientan orgullosos de su origen y entiendan que su mayor superpoder es el amor propio.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Inversión privada","alianzas":"Con municipio/gobierno local","tecnologia":"Herramientas de IA (texto/imagen/audio/video). IA para actualización dinámica de contenido y personaje.","email":"nestorpaltanyc@gmail.com","contacto":"Nestor Palta","telefono":"935656623","req3":"Difusión, Financiamiento, Propiedad Intelectual (PI)","validacion":"Ninguna aún"},
{"n":20,"nombre":"Kundalini Austral","resumen":"Plataforma digital territorial que centraliza y democratiza el acceso a la oferta cultural, turística y deportiva de la región. Resuelve la fragmentación de información en múltiples canales que reduce participación e impacto económico del ecosistema territorial.","provincia":"Elqui","comuna":"Coquimbo","sector":"Turismo sostenible, Sectores emergentes","etapa":"Idea","problema":"El proyecto responde a la actual fragmentación de la información sobre actividades culturales, turísticas y deportivas, que dificulta el acceso, reduce la participación y limita el impacto económico del ecosistema territorial. La oferta se encuentra dispersa en múltiples canales digitales sin estandarización ni actualización centralizada.","solucion":"El proyecto resuelve la fragmentación mediante el desarrollo de una plataforma digital integrada (web y aplicación móvil) que centraliza y estandariza la oferta cultural, turística y deportiva del territorio. La solución incorpora un sistema de autogestión que permite a organizadores públicos y privados publicar y actualizar sus actividades en tiempo real.","segmento":"","beneficios":"El proyecto genera un beneficio concreto al aumentar la participación ciudadana y turística en actividades culturales, deportivas y recreativas, mejorando su visibilidad y accesibilidad.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Fondos públicos, Crowdfunding","alianzas":"Ninguna","tecnologia":"Desarrollo web/app (stack libre), Mapping/instalación interactiva, Bases de datos/analítica, geolocalización.","email":"rbduhalde@gmail.com","contacto":"Robinson Duhalde Carrasco","telefono":"68338708","req3":"Mentoría técnica, Mentoría negocio, Financiamiento","validacion":"Ninguna aún"},
{"n":21,"nombre":"La Mejías studio","resumen":"Estudio de branding estratégico que crea marcas con intención, propósito y profundidad para emprendedores y negocios creativos mediante el método One Concept. Potencia su proceso con IA y experiencias inmersivas para hacer el diseño más accesible y eficiente.","provincia":"Elqui","comuna":"La Serena","sector":"Industria y servicios conexos","etapa":"Ventas iniciales","problema":"LMS resuelve la necesidad de emprendedores y negocios creativos de construir marcas claras, coherentes, con significado, atemporales y competitivas en un entorno que cambia rápido. Los principales beneficiarios son fundadores de marcas, pequeñas, medianas y grandes empresas y personas que buscan profesionalizar su marca.","solucion":"Resuelvo esta necesidad mediante mi método One Concept, un proceso creativo personalizado que permite descubrir y expresar la esencia real de cada marca. Parto desde una investigación profunda y una conversación cercana con el cliente, para luego guiarlo estratégicamente hacia una identidad visual única, coherente y emocionalmente conectada con su audiencia. Mi metodología incluye investigación, brief y análisis, estrategia de marca, moodboard, diseño y creación de elementos gráficos.","segmento":"","beneficios":"Una marca técnicamente sólida: clara, ordenada, coherente, estratégica y atemporal, diseñada para posicionarse con fuerza, diferenciarse de la competencia y atraer clientes realmente calificados.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos","alianzas":"Ninguna","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video).","email":"lamejiasbrandstudio@gmail.com","contacto":"Valentina Navarrete Mejías","telefono":"56945395662","req3":"Mentoría negocio, Contactos industria, Internacionalización","validacion":"Ventas / preventas"},
{"n":22,"nombre":"La Sombra del Tamaya","resumen":"Experiencia inmersiva de alta fidelidad en Unreal Engine 5 que recrea un centro minero del siglo XIX en la Provincia del Limarí. Combina investigación histórica rigurosa con tecnología XR para conectar a estudiantes con su patrimonio local.","provincia":"Limarí","comuna":"Ovalle","sector":"Sectores emergentes","etapa":"Prototipo","problema":"Nuestro proyecto resuelve la problemática de la escasa cabida que tiene el patrimonio local en la educación formal, situación que provoca que las nuevas generaciones crezcan desconectadas de su herencia cultural, sumado a la insuficiente utilización de tecnologías innovadoras para la valorización del patrimonio minero de la Provincia del Limarí.","solucion":"Resolvemos esta problemática mediante la convergencia de una rigurosa investigación histórica y el uso de tecnologías inmersivas de vanguardia. Desarrollamos una recreación virtual de alta fidelidad de una mina del siglo XIX utilizando Unreal Engine 5, basada en 17 años de investigación histórica de la zona de Tamaya y Limarí. Además diseñamos actividades interactivas en Genially y una guía didáctica alineada con el currículum nacional.","segmento":"","beneficios":"La modernización y democratización del acceso al patrimonio cultural regional, transformando un contenido histórico estático en una experiencia vivencial y permanente disponible para descarga gratuita.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Fondos públicos","alianzas":"Ninguna","tecnologia":"Motor de videojuegos (Unreal Engine 5), Herramientas de IA (texto/imagen/audio/video).","email":"dbuguenosalvo@gmail.com","contacto":"Diego Bugueño Salvo","telefono":"56978845739","req3":"Mentoría negocio, Difusión, Financiamiento","validacion":"Ninguna aún"},
{"n":23,"nombre":"Lágrimas de estrella","resumen":"Serie narrativa de fantasía que integra cosmovisión de pueblos originarios, estética anime y simbolismo emocional para representar conflictos de identidad, memoria y convivencia comunitaria. Busca dar visibilidad a perspectivas indígenas en contenidos audiovisuales contemporáneos.","provincia":"Elqui","comuna":"Coquimbo","sector":"Sectores emergentes","etapa":"Prototipo","problema":"Existe una necesidad de contenidos narrativos y audiovisuales que conecten con las emociones, la identidad cultural y la cosmovisión de los pueblos originarios desde una mirada contemporánea y sensible. Muchas historias actuales invisibilizan estas perspectivas o las tratan de forma superficial.","solucion":"Este proyecto aborda esta necesidad a través del desarrollo de una serie narrativa que utiliza la fantasía y el simbolismo como herramientas para representar emociones, decisiones y consecuencias humanas. Mediante la creación de personajes complejos, un mundo inspirado en culturas originarias y una narrativa centrada en la experiencia emocional, genera un espacio de reflexión y conexión con el espectador.","segmento":"","beneficios":"Una experiencia narrativa y audiovisual que promueve la reflexión emocional, el reconocimiento de la identidad cultural y la comprensión de las consecuencias de las acciones individuales y colectivas.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Fondos públicos, Crowdfunding","alianzas":"Ninguna","tecnologia":"Motor de videojuegos (Unity/Unreal/Godot), Herramientas de IA (texto/imagen/audio/video).","email":"hellencilla06@gmail.com","contacto":"Hellen Hernández","telefono":"2233 1922","req3":"Mentoría técnica, Difusión, Propiedad Intelectual (PI)","validacion":"Entrevistas con usuarios, Pruebas de usabilidad / playtest"},
{"n":24,"nombre":"Limarí XR — Patrimonio Vivo","resumen":"Experiencia patrimonial integrada que traduce el patrimonio cultural, arqueológico y natural del Limarí en un producto turístico inmersivo, accesible y replicable. Articula contenido XR con activaciones en espacios físicos para conectar a visitantes y comunidad con el territorio.","provincia":"Limarí","comuna":"Ovalle","sector":"Turismo sostenible","etapa":"Idea","problema":"En la Provincia del Limarí existe un patrimonio cultural, cosmovisión diaguita y sitios arqueológicos y un patrimonio natural de alto valor, pero que aún no se traduce de manera suficiente en experiencias claras, atractivas y accesibles para la comunidad y para quienes visitan el territorio. Muchas visitas ocurren 'de paso', con baja comprensión del relato identitario y menor permanencia.","solucion":"Diseñando una experiencia patrimonial integrada que traduce el Limarí a un relato simple y memorable, y lo convierte en un producto turístico usable y replicable. Limarí XR articula un contenido central inmersivo que entrega contexto e identidad y lo conecta con activaciones en espacios culturales/educativos mediante herramientas digitales de fácil acceso (como el celular).","segmento":"","beneficios":"Nuestro proyecto convierte el patrimonio del Limarí en una experiencia entendible y atractiva, capaz de generar mayor valoración del territorio y activar demanda turística con sentido. La visita deja de ser 'de paso' y se transforma en una vivencia con significado.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Ventas, Fondos públicos, Inversión privada, Patrocinio","alianzas":"Con pares/otros proyectos, Con municipio/gobierno local, Observatorio Turístico Cruz del Sur","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Realidad Extendida AR/VR, Mapping/instalación interactiva, Bases de datos/analítica.","email":"v.ariasllanos@gmail.com","contacto":"Valentina Arias Llanos","telefono":"56948479885","req3":"Mentoría técnica, Acceso prototipado/testeo, Financiamiento","validacion":"Ninguna aún"},
{"n":25,"nombre":"Liminal / Caos de Couve","resumen":"Proyecto artístico interdisciplinario que reflexiona sobre los paisajes de abandono en el Valle de Elqui usando mapping e instalación interactiva. Propone experiencias que activan el pensamiento crítico sobre espacios, ecología e identidad territorial.","provincia":"Elqui","comuna":"Coquimbo–La Serena","sector":"Turismo sostenible, Sectores emergentes","etapa":"Idea","problema":"Los paisajes de abandono en el valle del Elqui, tanto en Nueva Elqui como en viñedos en desuso. Los beneficiarios somos la comunidad elquina y los habitantes de zonas aledañas.","solucion":"Reflexionar creativa y artísticamente sobre el abandono de espacios en el territorio, y su impacto en la conformación de nuestra identidad, así como el desarrollo del pensamiento crítico sobre prácticas extractivistas, ecología, abandono. La reflexión es artística con un equipo interdisciplinario que incluye arquitectos, fotógrafos, audiovisualistas, diseñadoras y una doctora en estudios culturales.","segmento":"","beneficios":"Pensamiento interdisciplinario de un equipo volcado en este proyecto, que involucra arquitectos, fotógrafos, audiovisualistas, diseñadoras y una doctora en estudios culturales.","modelo_ingresos":"Contamos con una estructura definida de ingresos y costos principales, con estimaciones y supuestos que estamos usando para tomar decisiones.","financiamiento":"Fondos públicos, Inversión privada","alianzas":"Con instituciones (U/incubadora), Fondart","tecnologia":"Mapping/instalación interactiva. VideoMapping site-specific en dos locaciones específicas del Valle de Elqui.","email":"aozuljevics@gmail.com","contacto":"Ashle Ozuljevic Subaique","telefono":"963263737","req3":"Contactos industria, Financiamiento, Internacionalización","validacion":"Carta de interés / LoI"},
{"n":26,"nombre":"MELI / Astral Dream Team","resumen":"Videojuego narrativo donde el arte, el color y la música se ajustan dinámicamente al estado emocional del protagonista para generar empatía real en el jugador. Aborda salud mental juvenil, identidad trans e inclusión desde una experiencia contemporánea y personal.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Prototipo","problema":"Meli nace de una necesidad simple pero pesada: que exista una historia donde la gente joven pueda verse reflejada cuando está pasando por cosas reales (identidad, ansiedad, trauma, conflictos familiares, sentirse fuera de lugar). La historia sigue a Meli, un chico trans que intenta sobrevivir su día a día entre la ciudad, el control del entorno, relaciones que se rompen y la presión de 'ser alguien' cuando por dentro estás hecho bolsa.","solucion":"Lo resuelvo creando una experiencia narrativa interactiva donde el jugador no solo 'lee' lo que vive Meli, sino que lo siente a través del juego: el color, la música, el ritmo y el control se ajustan al estado emocional del protagonista y a lo que está pasando en su entorno. Así, el arte y el sonido funcionan como una extensión de sus emociones, acompañando al jugador en un recorrido que busca identificación, reflexión y compañía.","segmento":"","beneficios":"El beneficio concreto de Meli es entregar una experiencia de acompañamiento emocional: un juego donde puedes verte reflejado y sentir que no estás solo, porque las emociones se cuentan con el arte, el color y la música, no solo con diálogos.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Fondos públicos, Crowdfunding","alianzas":"Ninguna","tecnologia":"Motor de videojuegos (Unity/Unreal/Godot) como herramienta de expresión narrativa y emocional.","email":"astraldreamteam@gmail.com","contacto":"Williams Cruz Saavedra","telefono":"73958461","req3":"Mentoría técnica, Difusión, Financiamiento","validacion":"Test de concepto, Pruebas de usabilidad / playtest"},
{"n":27,"nombre":"MEMO — Plataforma Adultos Mayores","resumen":"Plataforma digital inclusiva de estimulación cognitiva y salud mental para adultos mayores, que usa machine learning para personalizar actividades según las necesidades de cada usuario. Responde al envejecimiento poblacional y el aumento de enfermedades neurodegenerativas proyectado al 2050.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Idea","problema":"El problema detectado es la escasa accesibilidad a terapias y actividades de estimulación cognitiva y de salud mental para la tercera edad. Para el 2050 más del 30% de la población será adulto mayor, lo que también se traduce en un aumento de enfermedades neurodegenerativas. Las soluciones actuales son análogas, generalistas o privativas a nivel económico.","solucion":"Utilizando machine learning la plataforma ofrece actividades adecuadas a cada caso, adaptándose a las necesidades de cada usuario, permitiendo que no sean ni muy fáciles ni muy difíciles. Además, la información recolectada permitirá dar aviso si es que se perciben deterioros o nuevas necesidades para el cuidado de las personas. La plataforma también invita a mantenerse activo a través de cursos y ofertas de empleos para personas de la tercera edad.","segmento":"","beneficios":"Acceso a actividades de estimulación cognitiva e información para seguir estando activos y actualizados en lo que ocurre en la sociedad.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Ventas, Fondos públicos","alianzas":"Ninguna","tecnologia":"Motor de videojuegos (Unity/Unreal/Godot), Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Hardware/sensores/IoT, Bases de datos/analítica.","email":"mosqueiramaca@gmail.com","contacto":"Macarena Mosqueira","telefono":"56 938860264","req3":"Mentoría técnica, Alianzas comerciales, Acceso prototipado/testeo","validacion":"Entrevistas con usuarios"},
{"n":28,"nombre":"MIBODALINK","resumen":"Plataforma digital para organizar matrimonios que reúne proveedores locales verificados, inspiración, contenido educativo y reseñas reales. Usa app, web e IA para optimizar el tiempo de los novios en la planificación.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Prototipo","problema":"Los novios pierden mucho tiempo organizando una boda buscando en redes sociales y pidiendo recomendaciones para encontrar proveedores confiables para su matrimonio.","solucion":"Con tecnología: aplicación, página web e inteligencia artificial. Me diferencio ofreciendo un lugar donde se reúnan proveedores verificados, ofrezca inspiración y contenido educativo, genere confianza a través de reseñas reales.","segmento":"","beneficios":"Optimización del tiempo de los novios para organizar una boda, con proveedores locales y territoriales verificados.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ninguna","alianzas":"Con industria/empresas, Centro de eventos","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video).","email":"contactovideo.silvana@gmail.com","contacto":"Silvana Meza","telefono":"56964737871","req3":"Mentoría técnica, Financiamiento, Propiedad Intelectual (PI)","validacion":"Ninguna aún"},
{"n":29,"nombre":"Micelio norte / Fungisystem biotec","resumen":"Empresa de base científico-tecnológica que desarrolla biotecnología fúngica aplicada al territorio semiárido. Crea biomateriales a partir de residuos agroindustriales regionales y opera un laboratorio inmersivo itinerante que acerca la ciencia a comunidades.","provincia":"Elqui","comuna":"La Serena","sector":"Alimentos, Sectores emergentes","etapa":"Prototipo","problema":"Abordamos la brecha entre el conocimiento científico sobre el Reino Fungi y su comprensión pública y productiva en ecosistemas semiáridos del norte de Chile. A pesar de su rol clave en regeneración de suelos, ciclos de nutrientes y resiliencia climática, los hongos siguen siendo poco visibles en educación, cultura e innovación territorial. Además, existe subutilización de residuos agroindustriales regionales.","solucion":"Nos diferenciamos porque no somos únicamente una iniciativa de divulgación científica o artística, sino una Empresa de Base Científico-Tecnológica (EBCT) que desarrolla investigación aplicada en biotecnología fúngica con proyección productiva. Desarrollamos biomateriales propios a partir de subproductos agroindustriales del territorio semiárido, junto a investigación aplicada con la Universidad de La Serena.","segmento":"","beneficios":"Transformación del conocimiento micológico en experiencias inmersivas basadas en procesos biológicos reales. La comunidad interactúa con biomateriales desarrollados localmente, observa cultivos en microscopio y presencia procesos de biorremediación.","modelo_ingresos":"Aún no lo tenemos definido; es un aspecto que todavía no hemos trabajado en profundidad.","financiamiento":"Fondos públicos, Inversión privada","alianzas":"Con instituciones (U/incubadora), Con pares/otros proyectos, Con industria/empresas","tecnologia":"Realidad Extendida AR/VR, Mapping/instalación interactiva, Hardware/sensores/IoT.","email":"corellanag711@gmail.com","contacto":"Cristóbal Orellana","telefono":"56940998426","req3":"Mentoría negocio, Alianzas comerciales, Difusión","validacion":"Test de concepto, Interés por colaboraciones"},
{"n":30,"nombre":"Mujer Innovadora","resumen":"Medio de comunicación multiplataforma y programa de formación orientado a emprendedoras y disidencias para reducir la brecha digital y alcanzar autonomía económica. Combina difusión de emprendimientos con capacitación en herramientas digitales y estrategias de escalamiento.","provincia":"Elqui","comuna":"La Serena","sector":"Sectores emergentes","etapa":"Piloto","problema":"Muchas ideas brillantes y negocios con propósito se quedan estancados por no saber cómo competir en el mundo digital o por no tener una plataforma que amplifique su voz.","solucion":"Abordamos esta problemática desde dos puntos de vista, cuyo propósito es lograr la autonomía económica de las mujeres y las disidencias. Formación: talleres prácticos y habilidades digitales. Visibilidad Real: a través de la plataforma MujerInnovadora.cl, difundimos pequeños emprendimientos, sobre todo de mujeres en situación de alta vulnerabilidad social.","segmento":"","beneficios":"El beneficio concreto que entregamos es la transformación de la mujer cuidadora y emprendedora en una líder económicamente autónoma y técnicamente capacitada.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Fondos públicos, Inversión privada, Patrocinio, Crowdfunding","alianzas":"Con municipio/gobierno local","tecnologia":"Desarrollo web/app (stack libre), Herramientas de IA (texto/imagen/audio/video), Mapping/instalación interactiva, Bases de datos/analítica.","email":"aliciaacunagalleguillos@gmail.com","contacto":"Alicia Isabel Acuña Galleguillos","telefono":"994614778","req3":"Difusión, Financiamiento, Internacionalización","validacion":"Entrevistas con usuarios, Ventas / preventas, Carta de interés / LoI"},
{"n":31,"nombre":"Nino_nyart — Cómic Digital","resumen":"Cómic digital con estética manga contemporánea que aborda conflictos emocionales, identidad y diversidad en la adolescencia. Integra herramientas tecnológicas para optimizar el proceso creativo y estrategias de difusión digital para alcanzar audiencias juveniles.","provincia":"Elqui","comuna":"Coquimbo","sector":"Sectores emergentes","etapa":"Idea","problema":"El proyecto responde a la necesidad de mayor representación emocional y diversidad en contenidos juveniles, especialmente en narrativas gráficas dirigidas a adolescentes. Muchos jóvenes no encuentran historias cercanas que reflejen sus conflictos emocionales, procesos de identidad y relaciones afectivas desde una mirada honesta y contemporánea.","solucion":"El proyecto aborda esta necesidad mediante la creación de un cómic digital que presenta historias centradas en experiencias emocionales reales, utilizando la narrativa visual como herramienta de conexión y empatía. A través de publicación digital, estrategias de difusión online y el desarrollo progresivo de una comunidad de lectores, se busca generar un espacio accesible donde jóvenes puedan identificarse con los personajes y reflexionar sobre sus propias vivencias.","segmento":"","beneficios":"Ofrecer a adolescentes y jóvenes un espacio de identificación emocional a través de una narrativa gráfica cercana y contemporánea que genera empatía, validación emocional y representación de experiencias juveniles.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Patrocinio","alianzas":"Ninguna","tecnologia":"Herramientas de IA (texto/imagen/audio/video), Ilustración digital (Clip Studio Paint / Procreate), plataformas de publicación digital.","email":"ninoskhalohmayer@gmail.com","contacto":"Ninoskha Lohmayer","telefono":"56964526592","req3":"Mentoría negocio, Contactos industria, Internacionalización","validacion":"Ninguna aún"},
{"n":32,"nombre":"Prevención a través del Cine (colapso)","resumen":"Productora audiovisual especializada en cine educativo y de prevención sobre VIH, drogas, bullying y violencia de género. Combina largometrajes de ficción con metodologías validadas por psicólogos. Con 19 años de trayectoria y 3 largometrajes financiados por FOSIS, SERCOTEC, CORFO y Minera Escondida.","provincia":"Choapa","comuna":"Los Vilos","sector":"Industria y servicios conexos, Turismo sostenible, Sectores emergentes","etapa":"Ventas iniciales","problema":"En Chile existe una brecha crítica en la educación preventiva tanto en el sistema escolar como en el ámbito laboral. Los programas tradicionales de prevención basados en charlas expositivas, volantes informativos y videos institucionales de baja producción no logran generar empatía ni retención efectiva del mensaje.","solucion":"Colapso Producciones resuelve la falta de herramientas educativas preventivas efectivas mediante un modelo de intervención que combina el poder narrativo del cine de ficción con el rigor metodológico realizado por psicólogos. Desarrollamos largometrajes que abordan temas sensibles a través de historias de personajes creíbles, acompañados de planes metodológicos y pautas de evaluación que permiten medir el impacto real.","segmento":"","beneficios":"El beneficio concreto es lograr que los mensajes preventivos realmente sean recordados y discutidos por quienes los reciben, transformando la prevención de un trámite institucional olvidable en una experiencia que genera cambio de actitudes medible.","modelo_ingresos":"Tenemos identificadas algunas fuentes de ingresos y costos relevantes, aunque aún estamos afinando detalles y estimaciones.","financiamiento":"Ventas, Fondos públicos, Inversión privada, Patrocinio, Crowdfunding","alianzas":"Con instituciones (U/incubadora), Con pares/otros proyectos, Con industria/empresas, Con municipio/gobierno local","tecnologia":"Desarrollo web/app (stack libre), Realidad Extendida AR/VR, Bases de datos/analítica.","email":"colapsoproducciones@gmail.com","contacto":"Jaime Patricio Pinto Garrido","telefono":"56998164608","req3":"Mentoría negocio, Contactos industria, Alianzas comerciales","validacion":"Ventas / preventas"},

const STAGES = [
  {key:'Idea',     icon:'💡', color:'#EF9F27', bg:'#FEF3D8', txt:'#7b5c00', cls:'b-idea'},
  {key:'Prototipo',icon:'🔧', color:'#378ADD', bg:'#D6EAF8', txt:'#0c447c', cls:'b-prototipo'},
  {key:'Piloto',   icon:'🚀', color:'#639922', bg:'#D4EDDA', txt:'#27500a', cls:'b-piloto'},
  {key:'Ventas iniciales',icon:'💰',color:'#7F77DD',bg:'#E8D5F5',txt:'#3c3489',cls:'b-ventas'}
];

function getStageIdx(e){
  if(!e) return -1;
  if(e.includes('Idea')) return 0;
  if(e.includes('Prototipo')) return 1;
  if(e.includes('Piloto')) return 2;
  if(e.includes('Ventas')) return 3;
  return -1;
}

function tags(text, emptyLabel){
  if(!text || text==='Ninguna' || text.trim()==='' || text==='nan')
    return `<span class="empty-tag">${emptyLabel||'Por completar'}</span>`;
  return text.split(',').map(t=>t.trim()).filter(Boolean)
    .map(t=>`<span class="tag">${t}</span>`).join('');
}

function txt(text, fallback){
  if(!text || text==='nan' || text.trim()==='')
    return `<span class="card-text empty">${fallback||'Por completar...'}</span>`;
  return `<div class="card-text">${text}</div>`;
}

function pct(p){
  const fields = [p.problema, p.solucion, p.segmento, p.beneficios, p.modelo_ingresos, p.alianzas, p.tecnologia, p.validacion];
  const filled = fields.filter(v => v && v.trim() && v !== 'Ninguna').length;
  return Math.round(filled / fields.length * 100);
}

function buildStageViz(etapa){
  const idx = getStageIdx(etapa);
  const connPct = idx < 0 ? 0 : [0, 33, 66, 100][idx];
  const connColor = idx >= 0 ? STAGES[idx].color : '#e0dfd8';

  const items = STAGES.map((s, i) => {
    const isDone   = i < idx;
    const isActive = i === idx;
    const circleBg = isActive ? s.color : isDone ? s.color : '#f0efe8';
    const circleBorder = isActive || isDone ? s.color : '#e0dfd8';
    const nameColor = isActive ? s.txt : isDone ? '#5f5e5a' : '#aaa9a2';
    const scale = isActive ? 'transform:scale(1.12)' : '';
    return `<div class="stage-item">
      <div class="stage-circle ${isActive?'active':''}" style="background:${circleBg};border-color:${circleBorder};${scale}">
        <span style="font-size:18px">${s.icon}</span>
      </div>
      <div class="stage-name ${isActive?'active':''}" style="color:${nameColor}">${s.key}</div>
      ${isActive ? `<span class="stage-pill" style="background:${s.bg};color:${s.txt}">Actual</span>` : ''}
    </div>`;
  }).join('');

  return `<div class="stage-card">
    <div class="stage-card-label">Etapa actual del emprendimiento</div>
    <div style="position:relative;padding:0 24px">
      <div class="stage-track">${items}</div>
      <div class="stage-connector">
        <div class="stage-connector-fill" style="width:${connPct}%;background:${connColor}"></div>
      </div>
    </div>
  </div>`;
}

  sel.appendChild(o);
});
sel.addEventListener('change',()=>{cur=+sel.value; render();});
function go(d){cur=Math.max(0,Math.min(DATA.length-1,cur+d));sel.value=cur;render();}

function render(){
  const p = DATA[cur];
  document.getElementById('ctr').textContent = `${cur+1} / ${DATA.length}`;
  const idx   = getStageIdx(p.etapa);
  const stage = idx >= 0 ? STAGES[idx] : null;
  const et    = stage ? stage.key : 'Sin dato';
  const loc   = [p.comuna, p.provincia].filter(Boolean).join(' · ');
  const comp  = pct(p);

  const valItems = (p.validacion && p.validacion.trim() && !p.validacion.includes('aún'))
    ? p.validacion.split(',').map(v=>v.trim()).filter(Boolean)
    : [];

  document.getElementById('pg').innerHTML = `
    <div class="header-card">
      <div class="header-top">
        <div class="header-meta">
          <span class="badge b-sector">${p.sector || 'Sector no definido'}</span>
          ${stage ? `<span class="badge ${stage.cls}">${et}</span>` : ''}
        </div>
        <div class="h-num">Emprendimiento ${p.n} de 43 — Región de Coquimbo</div>
        <div class="h-name">${p.nombre}</div>
        ${loc ? `<div class="h-loc">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          ${loc}
        </div>` : ''}
      </div>
      <div class="header-bottom">
        <div class="resumen-block">
          <div class="resumen-label">Resumen del proyecto</div>
          <div class="resumen-text">${p.resumen || '<span style="color:#aaa9a2;font-style:italic">Por completar...</span>'}</div>
        </div>
        ${p.contacto || p.email ? `<div class="contact-block">
          <div class="contact-label">Contacto</div>
          <div class="contact-name">${p.contacto || '—'}</div>
          ${p.email ? `<div class="contact-info"><a href="mailto:${p.email}" style="color:#185FA5">${p.email}</a></div>` : ''}
          ${p.telefono ? `<div class="contact-info">${p.telefono}</div>` : ''}
        </div>` : ''}
      </div>
    </div>

    ${buildStageViz(p.etapa)}

    <div class="metrics">
      <div class="mc">
        <div class="mc-label">Validaciones realizadas</div>
        <div class="mc-val" style="color:#0F6E56">${valItems.length}</div>
        <div class="mc-sub">${valItems.length > 0 ? valItems[0] : 'Sin validación aún'}</div>
      </div>
      <div class="mc">
        <div class="mc-label">Completitud del perfil</div>
        <div class="mc-val">${comp}%</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${comp}%"></div></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-label">Problema que resuelve</div>
        ${txt(p.problema)}
      </div>
      <div class="card">
        <div class="card-label">Solución propuesta</div>
        ${txt(p.solucion)}
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-label">Beneficios para el cliente</div>
        ${txt(p.beneficios)}
      </div>
      <div class="card">
        <div class="card-label">Segmento de clientes</div>
        ${txt(p.segmento)}
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-label">Modelo de ingresos</div>
        ${txt(p.modelo_ingresos)}
      </div>
      <div class="card">
        <div class="card-label">Fuentes de financiamiento</div>
        <div class="tag-row">${tags(p.financiamiento,'Sin fuentes definidas aún')}</div>
      </div>
    </div>

    <div class="card full" style="margin-bottom:14px">
      <div class="card-label">Tecnología utilizada o esperada</div>
      ${txt(p.tecnologia)}
    </div>

    <div class="grid3">
      <div class="card">
        <div class="card-label">Alianzas</div>
        <div class="tag-row">${tags(p.alianzas,'Sin alianzas definidas')}</div>
      </div>
      <div class="card">
        <div class="card-label">Requerimientos / servicios</div>
        <div class="tag-row">${tags(p.req3,'Sin requerimientos definidos')}</div>
      </div>
      <div class="card">
        <div class="card-label">Validación realizada</div>
        <div class="val-list">
          ${valItems.length > 0
            ? valItems.map(v=>`<div class="val-item"><div class="val-dot"></div>${v}</div>`).join('')
            : '<div class="val-item"><div class="val-dot empty"></div><span style="color:#aaa9a2;font-style:italic">Ninguna aún</span></div>'}
        </div>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
